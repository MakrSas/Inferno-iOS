name: Сборка Inferno.ipa

# Собирает неподписанный Inferno.ipa на раннере GitHub — маку разработчика для
# этого быть не нужно. Артефакт висит на прогоне; для тега vX.Y он ещё и
# прикладывается к релизу.
#
# Гостевой образ, прошивки и ключи Apple здесь по-прежнему не участвуют — их
# собирают сами по гайду ChefKiss (см. README).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator_ref:
        description: "Ветка/тег форка эмулятора (MakrSas/Inferno)"
        default: "ios"

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # нужно только шагу релиза

jobs:
  build:
    runs-on: macos-15
    env:
      EMULATOR_REF: ${{ github.event.inputs.emulator_ref || 'ios' }}
      PREFIX: ${{ github.workspace }}/prefix

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Выбрать Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Инструменты сборки
        run: |
          brew install --quiet meson ninja pkg-config autoconf automake libtool m4 qemu
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"

      - name: Отпечаток окружения (ключ кэша)
        id: env
        run: |
          echo "xcode=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "deps=${{ hashFiles('scripts/build-ios-deps.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Кэш зависимостей (prefix)
        id: cache-prefix
        uses: actions/cache@v4
        with:
          path: prefix
          key: iosdeps-${{ runner.os }}-${{ steps.env.outputs.xcode }}-${{ steps.env.outputs.deps }}

      - name: Собрать зависимости под iOS
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: PREFIX="$PREFIX" JOBS=3 scripts/build-ios-deps.sh

      - name: Клонировать форк эмулятора
        run: |
          git clone --depth 1 -b "$EMULATOR_REF" \
            https://github.com/MakrSas/Inferno.git inferno-src

      - name: Meson cross-file
        run: PREFIX="$PREFIX" ./make-cross-file.sh

      - name: Собрать libqemu-aarch64-softmmu.dylib
        run: |
          meson setup build/inferno inferno-src \
            --cross-file=cross-ios-arm64.txt \
            -Dbuildtype=release -Dprefix="$PREFIX" \
            -Dshared_lib=true -Db_staticpic=true -Dwerror=false \
            -Dkvm=disabled -Dhvf=disabled -Dwhpx=disabled \
            -Dcocoa=disabled -Dgtk=disabled -Dsdl=disabled -Dcurses=disabled \
            -Dcoreaudio=disabled -Dcurl=disabled -Dlibssh=disabled -Dbzip2=disabled \
            -Dvnc=enabled -Dvnc_jpeg=disabled -Dvnc_sasl=disabled \
            -Dtools=disabled -Dcoroutine_backend=ucontext
          ninja -C build/inferno libqemu-aarch64-softmmu.dylib

      - name: Собрать Inferno.ipa
        working-directory: app
        env:
          INFERNO_NO_ICON: "1"    # actool .icon требует Xcode 26+
          INFERNO_KEYMAPS: /opt/homebrew/share/qemu/keymaps
        run: ./build.sh

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Inferno-ipa
          path: app/Inferno.ipa
          if-no-files-found: error

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/Inferno.ipa
          fail_on_unmatched_files: true
